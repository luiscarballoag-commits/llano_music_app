name: llano_music_app
description: La aplicación del auténtico sonido del Llano

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Nuevo reproductor de audio
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/banners/
    - assets/images/artistas/
    - assets/images/clasicos/
    - assets/images/logo/
    - assets/images/icons/
