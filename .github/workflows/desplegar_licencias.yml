name: Desplegar generador de licencias

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-y-desplegar:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validar generador
        run: deno check supabase/functions/generar-licencias/index.ts

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Desplegar generador
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "Falta el secreto SUPABASE_ACCESS_TOKEN"
            exit 1
          }

          supabase functions deploy generar-licencias \
            --project-ref fhpvfvbwxjclwhysbqab \
            --no-verify-jwt
