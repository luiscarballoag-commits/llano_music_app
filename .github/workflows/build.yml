name: Build APK Release

on:
  push:
    branches:
      - prueba-96kbps

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.5"
          channel: stable

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar firma Release
        env:
          KEYSTORE_BASE64: ${{ secrets.LLANO_MUSIC_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LLANO_MUSIC_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.LLANO_MUSIC_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/llano_music_release.p12
          test -n "$STORE_PASSWORD" || { echo "ERROR: LLANO_MUSIC_STORE_PASSWORD vacío"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ERROR: LLANO_MUSIC_KEY_PASSWORD vacío"; exit 1; }

          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=llano_music\nstoreFile=app/llano_music_release.p12\n" "$STORE_PASSWORD" "$KEY_PASSWORD" > android/key.properties
          echo "Propiedades generadas:"
          grep -E "^(storePassword|keyPassword|keyAlias|storeFile)=" android/key.properties | sed -E "s/=.*$/=<OK>/"

      - name: Obtener dependencias
        run: flutter pub get

      - name: Analizar proyecto
        run: flutter analyze

      - name: Compilar APK Release
        run: flutter build apk --release

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: llano_music_apk_release
          path: build/app/outputs/flutter-apk/app-release.apk
